<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthenEntra</title>
    <style>
        :root { color-scheme: light dark; font-family: Segoe UI, sans-serif; }
        body { margin: 0; background: #f4f7fb; color: #172033; }
        main { max-width: 720px; margin: 6rem auto; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 8px 28px #17203322; }
        h1 { margin-top: 0; }
        button, a { display: inline-block; margin: .4rem .4rem .4rem 0; padding: .65rem 1rem; border: 0; border-radius: 8px; background: #1565c0; color: white; text-decoration: none; cursor: pointer; }
        button.secondary, a.secondary { background: #546e7a; }
        #profile { margin-top: 1.5rem; padding: 1rem; background: #eef4fb; border-radius: 8px; white-space: pre-wrap; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <main>
        <h1>Microsoft Entra ID</h1>
        <p id="status">กำลังตรวจสอบสถานะการ Login...</p>
        <div>
            <button id="login" type="button">Login ด้วย Microsoft Account</button>
            <button id="logout" class="secondary hidden" type="button">Logout</button>
            <a class="secondary" href="/swagger" target="_blank" rel="noopener">เปิด Swagger UI</a>
        </div>
        <section id="profile" class="hidden" aria-live="polite"></section>
    </main>
    <script>
        const status = document.querySelector('#status');
        const profile = document.querySelector('#profile');
        const loginButton = document.querySelector('#login');
        const logoutButton = document.querySelector('#logout');

        function showLoggedOut(message = 'กรุณา Login เพื่อเรียกดูข้อมูลบัญชี') {
            status.textContent = message;
            loginButton.classList.remove('hidden');
            logoutButton.classList.add('hidden');
            profile.classList.add('hidden');
        }

        async function loadProfile() {
            const response = await fetch('/api/users/me', { credentials: 'include' });
            if (response.status === 401 || response.status === 302) {
                showLoggedOut();
                return;
            }
            if (!response.ok) {
                throw new Error(`เรียก API ไม่สำเร็จ (${response.status})`);
            }

            const user = await response.json();
            status.textContent = `Login แล้ว: ${user.displayName ?? user.userPrincipalName ?? 'Microsoft Account'}`;
            loginButton.classList.add('hidden');
            logoutButton.classList.remove('hidden');
            profile.textContent = JSON.stringify(user, null, 2);
            profile.classList.remove('hidden');
        }

        loginButton.addEventListener('click', () => {
            window.location.href = `/account/login?returnUrl=${encodeURIComponent('/')}`;
        });
        logoutButton.addEventListener('click', () => {
            window.location.href = '/account/logout';
        });
        loadProfile().catch(error => showLoggedOut(error.message));
    </script>
</body>
</html>
